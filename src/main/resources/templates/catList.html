<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список кошек</title>
</head>
<body>
<h1>Список кошек</h1>
<form action="/cats/add" method="post" th:object="${cat}">
  <input type="text" name="name" th:field="*{name}" placeholder="Имя кошки" required>
  <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Имя не менее 2 символов</div>
  <div>
    <label for="owner">Владелец: </label>
    <select id="owner" th:field="*{owner}">
      <option th:each="owner : ${owners}" th:value="${owner.id}" th:text="${owner.name}"></option>
    </select>
  </div>
  <button type="submit" formmethod="post">Добавить кошку</button>
</form>

<h2>Все кошки:</h2>

<ul>
  <th:block th:each="cat : ${cats}">
    <li>
      <span th:text="${cat.name}"></span>
      <form action="/cats/update" method="post" style="display:inline;">
        <input type="hidden" name="id" th:value="${cat.id}" required>
        <input type="text" name="name" th:value="${cat.name}" placeholder="Имя кошки" required>
        <div>
          <label for="owner">Владелец: </label>
          <select id="owner" name="owner">
            <option th:each="owner : ${owners}" th:value="${owner.id}" th:text="${owner.name}" th:selected="${owner.id == cat.owner.id}"></option>
          </select>
        </div>
        <button type="submit" formmethod="post">Обновить</button>
      </form>
      <form action="/cats/delete" method="post" style="display:inline;">
        <input type="hidden" name="id" th:value="${cat.id}" required>
        <button type="submit" formmethod="post">Удалить</button>
      </form>
    </li>
  </th:block>
</ul>
</body>
</html>

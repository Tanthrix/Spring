<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
</head>
<body>
<h1>Список студентов</h1>
<form action="/students/add" method="post" th:object="${student}">
    <input type="text" name="firstName" th:field="*{firstName}" placeholder="Фамилия" required>
    <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Фамилия не менее 2 символов</div>
    <input type="text" name="name" th:field="*{name}" placeholder="Имя" required>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Имя не менее 2 символов</div>
    <input type="text" name="lastName" th:field="*{lastName}" placeholder="Отчество">
    <input type="text" name="corpEmail" th:field="*{corpEmail}" placeholder="Емеил">
    <div th:if="${#fields.hasErrors('corpEmail')}" th:errors="*{corpEmail}">Email должен быть корректен</div>
    <button type="submit" formmethod="post">Добавить студента</button>
</form>

<h2>Все студенты:</h2>

<ul>
    <th:block th:each="student : ${students}">
        <li>
            <span th:text="${student.name} + ' ' + ${student.firstName} + ' '+ ${student.lastName}"></span>
            <form action="/students/update" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${student.id}" required>
                <input type="text" name="firstName" th:value="${student.firstName}" placeholder="Фамилия" required>
                <input type="text" name="name" th:value="${student.name}" placeholder="Имя" required>
                <input type="text" name="lastName" th:value="${student.lastName}" placeholder="Отчество">
                <input type="text" name="corpEmail" th:value="${student.corpEmail}" placeholder="Емеил">
                <button type="submit" formmethod="post">Обновить</button>
            </form>
            <form action="/students/delete" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${student.id}" required>
                <button type="submit" formmethod="post">Удалить</button>
            </form>
        </li>
    </th:block>
</ul>
</body>
</html>
